<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎄 Merry Christmas 🎄</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(#0b3d2e, #145a32);
      color: white;
      text-align: center;
      overflow-x: hidden;
    }

    header {
      padding: 40px 20px;
    }

    header h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    .big-tree {
      font-size: 12rem;
      margin: 20px 0 10px;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #fff; }
      to { text-shadow: 0 0 30px #f1c40f; }
    }

    .snowmen {
      display: flex;
      justify-content: center;
      gap: 40px;
      font-size: 4rem;
      margin-bottom: 30px;
      animation: bounce 3s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(6px);
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      margin: 0 auto 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .card h2 {
      margin-bottom: 15px;
    }

    .card p {
      line-height: 1.6;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 30px;
      background: #e74c3c;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #c0392b;
      transform: scale(1.05);
    }

    footer {
      padding: 20px;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    /* Snowfall Effect */
    .snow {
      position: fixed;
      top: -10px;
      color: white;
      font-size: 1rem;
      animation: fall linear infinite;
      opacity: 0.8;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh);
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>🎅 Merry Christmas 🎄</h1>
    <p>May the new year bring joy, health, and endless laughter ✨</p>
  </header>

  <div class="big-tree">🎄</div>

  <div class="snowmen">
    <span>⛄</span>
    <span>⛄</span>
    <span>⛄</span>
  </div>

  <div class="card">
    <h2>🎁 Christmas Message</h2>
    <p>
      This small website was created to bring the holiday spirit to life. 
      Wishing you a warm, peaceful, and happy new year with your loved ones! ❤️
    </p>
    <button onclick="alert('🎄 Merry Christmas! 🎅')">Click for a Surprise</button>
  </div>

  <footer>
    ❄️ Christmas Theme • Made with ❤️
  </footer>

  <script>
    // Generate Falling Snowflakes
    const snowCount = 40;

    for (let i = 0; i < snowCount; i++) {
      const snow = document.createElement('div');
      snow.className = 'snow';
      snow.innerHTML = '❄';
      snow.style.left = Math.random() * window.innerWidth + 'px';
      snow.style.animationDuration = 3 + Math.random() * 5 + 's';
      snow.style.fontSize = 10 + Math.random() * 20 + 'px';
      document.body.appendChild(snow);
    }
  </script>

</body>
</html>
